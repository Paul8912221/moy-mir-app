<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MY VIDEO AI</title><style>*{box-sizing:border-box}body{margin:0;background:#08080b;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:760px;margin:auto;padding:28px 18px 50px}.logo{font-size:28px;font-weight:800}.sub{color:#999;margin:6px 0 26px}.card{background:#121217;border:1px solid #292930;border-radius:22px;padding:18px;margin-bottom:14px}.drop{min-height:220px;border:1.5px dashed #555;border-radius:18px;display:flex;align-items:center;justify-content:center;text-align:center;cursor:pointer;overflow:hidden}.drop img{width:100%;height:300px;object-fit:cover;border-radius:14px}.plus{font-size:42px}.hint{color:#aaa}label{display:block;font-weight:700;margin-bottom:9px}textarea,select{width:100%;border:1px solid #303038;background:#0b0b0f;color:#fff;border-radius:14px;padding:14px;font:inherit}textarea{min-height:115px;resize:vertical}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{padding:10px 13px;border:1px solid #383840;border-radius:999px;color:#bbb;cursor:pointer}.chip.active{border-color:#fff;color:#fff;background:#202027}button{width:100%;border:0;border-radius:15px;padding:16px;font-size:17px;font-weight:800;background:#fff;color:#08080b;cursor:pointer}button:disabled{opacity:.45}.notice{font-size:13px;color:#888;line-height:1.45;margin-top:12px}@media(max-width:520px){.wrap{padding-top:20px}.drop img{height:260px}}</style></head><body><div class="wrap"><div class="logo">MY VIDEO AI</div><div class="sub">Превращаем фотографию в кинематографичное видео</div><div class="card"><label>1. Фотография</label><input id="file" type="file" accept="image/*" hidden><div class="drop" id="drop"><div><div class="plus">＋</div><div>Загрузить фотографию</div><div class="hint">JPG, PNG или WEBP</div></div></div></div><div class="card"><label>2. Что должно происходить?</label><textarea id="prompt" placeholder="Например: мужчина стоит в лесу, лёгкий ветер двигает волосы и листья, камера медленно приближается к лицу..."></textarea></div><div class="card"><label>3. Формат</label><div class="chips" id="formats"><div class="chip active">9:16 — Shorts</div><div class="chip">16:9 — YouTube</div><div class="chip">1:1 — пост</div></div></div><div class="card"><div class="row"><div><label>Длительность</label><select><option>5 секунд</option><option>10 секунд</option><option>15 секунд</option></select></div><div><label>Стиль</label><select><option>Кино</option><option>Реализм</option><option>Fashion</option><option>TikTok</option></select></div></div></div><div class="card"><button id="go" disabled>🎬 Создать видео</button><div class="notice">Интерфейс готов. Реальный AI-генератор подключим следующим этапом.</div></div></div><script>const f=document.querySelector('#file'),d=document.querySelector('#drop'),b=document.querySelector('#go');d.onclick=()=>f.click();f.onchange=()=>{if(f.files[0]){d.innerHTML='<img src="'+URL.createObjectURL(f.files[0])+'">';b.disabled=false}};document.querySelectorAll('.chip').forEach(x=>x.onclick=()=>{document.querySelectorAll('.chip').forEach(y=>y.classList.remove('active'));x.classList.add('active')});b.onclick=()=>alert('Интерфейс работает. Реальный AI-движок подключим следующим этапом.');</script></body></html>
