<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MY VIDEO AI</title><style>body{margin:0;background:#08080b;color:white;font:16px -apple-system,BlinkMacSystemFont,sans-serif}main{max-width:700px;margin:auto;padding:28px 18px}.card{background:#121217;border:1px solid #292930;border-radius:20px;padding:18px;margin:14px 0}input,textarea,select,button{width:100%;box-sizing:border-box;padding:14px;border-radius:12px;margin-top:8px}input,textarea,select{background:#09090d;color:white;border:1px solid #333}button{border:0;font-weight:800;font-size:17px}.preview{width:100%;max-height:500px;object-fit:cover;border-radius:14px;margin-top:12px}</style><main><h1>MY VIDEO AI</h1><p>Фото → кинематографичное видео</p><div class="card"><b>Фотография</b><input id="f" type="file" accept="image/*"><img id="p" class="preview" hidden></div><div class="card"><b>Что должно происходить?</b><textarea rows="6" placeholder="Например: камера медленно приближается, волосы двигаются от ветра, кинематографичный свет..."></textarea></div><div class="card"><select><option>9:16 — Shorts / Reels / VK Клипы</option><option>16:9 — YouTube</option><option>1:1</option></select><select><option>5 секунд</option><option>10 секунд</option><option>15 секунд</option></select></div><button onclick="alert('Сайт работает. Следующий этап — подключение настоящего AI-генератора видео.')">🎬 СОЗДАТЬ ВИДЕО</button></main><script>f.onchange=()=>{p.src=URL.createObjectURL(f.files[0]);p.hidden=false}</script>
